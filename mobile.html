<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>skyAgent — Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    /* ============================================================
       skyAgent — MOBILE (Claude-app-style, Skypoint Radix DS)
       Standalone phone build. Patterns translated for touch:
       rail -> slide-in drawer; popovers -> bottom sheets;
       composer pinned above the fold with safe-area insets.
       ============================================================ */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-base);
      font-size: var(--fs-2); line-height: var(--lh-2);
      color: var(--fg-high);
      background: var(--color-surface);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    button { font-family: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: var(--radius-2); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    /* ---- App shell: phone-framed on desktop, full-bleed on real phones ---- */
    .device {
      position: relative;
      width: 100%; max-width: 420px; margin: 0 auto;
      height: 100dvh; min-height: 100dvh;
      display: flex; flex-direction: column;
      background: var(--color-surface);
      overflow: clip;
    }
    @media (min-width: 480px) {
      body { background: var(--gray-3); display: flex; align-items: center; justify-content: center; padding: var(--space-5) 0; }
      .device { height: min(880px, calc(100dvh - 48px)); border-radius: 28px; box-shadow: var(--shadow-5); border: 1px solid var(--border-subtle); }
    }

    /* ============ TOP APP BAR ============ */
    .m-appbar {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: var(--space-1);
      height: 52px; padding: 0 var(--space-2);
      padding-top: env(safe-area-inset-top);
      height: calc(52px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--border-subtle);
      background: var(--color-surface);
      z-index: 30;
    }
    .m-iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border: 0; border-radius: var(--radius-3);
      background: transparent; color: var(--fg-high);
    }
    .m-iconbtn:active { background: var(--gray-3); }
    .m-iconbtn svg { width: 22px; height: 22px; }
    .m-appbar-title { flex: 1; display: flex; align-items: center; justify-content: center; }
    .m-appbar-title .sa-logo { height: 22px; width: auto; color: var(--fg-high); display: block; }

    /* ============ DRAWER (rail -> slide-in) ============ */
    .m-scrim {
      position: absolute; inset: 0; z-index: 40;
      background: var(--color-overlay);
      opacity: 0; visibility: hidden; transition: opacity .22s ease, visibility .22s ease;
    }
    .m-scrim.is-open { opacity: 1; visibility: visible; }
    .m-drawer {
      position: absolute; top: 0; left: 0; bottom: 0; z-index: 50;
      width: 86%; max-width: 340px;
      background: var(--color-surface);
      border-right: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-4);
      transform: translateX(-102%); transition: transform .24s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
    }
    .m-drawer.is-open { transform: translateX(0); }
    .m-drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-3) var(--space-4) var(--space-2);
    }
    .m-drawer-head .sa-logo { height: 26px; width: auto; color: var(--fg-high); }
    .m-drawer-body { flex: 1; overflow-y: auto; padding: var(--space-2) var(--space-3) var(--space-4); }
    .m-newchat {
      display: flex; align-items: center; justify-content: center; gap: var(--space-2);
      width: 100%; height: 46px; margin: var(--space-1) 0 var(--space-3);
      border: 0; border-radius: var(--radius-4);
      background: var(--accent-9); color: var(--accent-contrast);
      font-size: var(--fs-2); font-weight: var(--weight-medium);
    }
    .m-newchat:active { background: var(--accent-10); }
    .m-newchat svg { width: 18px; height: 18px; }

    .m-navlink {
      display: flex; align-items: center; gap: var(--space-3);
      width: 100%; min-height: 44px; padding: var(--space-2) var(--space-3);
      border: 0; background: transparent; text-align: left;
      color: var(--fg-high); font-size: var(--fs-2); border-radius: var(--radius-3);
    }
    .m-navlink:active { background: var(--gray-3); }
    .m-navlink svg { width: 20px; height: 20px; color: var(--fg-low); flex: none; }

    .m-search {
      position: relative; margin: var(--space-3) 0 var(--space-2);
    }
    .m-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--fg-subtle); }
    .m-search input {
      width: 100%; height: 42px; padding: 0 var(--space-3) 0 36px;
      border: 1px solid var(--border-ui); border-radius: var(--radius-3);
      background: var(--color-surface); color: var(--fg-high);
      font-family: inherit; font-size: var(--fs-2);
    }
    .m-search input::placeholder { color: var(--fg-subtle); }
    .m-search input:focus { outline: none; border-color: var(--border-strong); }

    .m-group-label {
      font-size: var(--fs-1); color: var(--fg-subtle);
      padding: var(--space-3) var(--space-3) var(--space-1);
      text-transform: none; letter-spacing: .01em;
    }
    .m-recent {
      display: flex; align-items: center; gap: var(--space-2);
      width: 100%; min-height: 42px; padding: var(--space-2) var(--space-3);
      border: 0; background: transparent; text-align: left;
      color: var(--fg-high); font-size: var(--fs-2); border-radius: var(--radius-3);
    }
    .m-recent:active { background: var(--gray-3); }
    .m-recent.is-active { background: var(--row-accent); }
    .m-recent .cr-dot { width: 7px; height: 7px; border-radius: var(--radius-full); background: var(--gray-7); flex: none; }
    .m-recent .cr-dot.is-live { background: var(--accent-9); }
    .m-recent .cr-dot.is-done { background: var(--green-9); }
    .m-recent .cr-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-showmore { display: block; width: 100%; text-align: left; padding: var(--space-2) var(--space-3); border: 0; background: transparent; color: var(--fg-low); font-size: var(--fs-1); }
    .m-noresult { display: none; padding: var(--space-4) var(--space-3); color: var(--fg-subtle); font-size: var(--fs-2); }

    .m-drawer-foot {
      flex: 0 0 auto; display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      padding-bottom: calc(var(--space-3) + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border-subtle);
    }
    .m-avatar { width: 34px; height: 34px; border-radius: var(--radius-full); background: var(--accent-9); color: var(--accent-contrast); display: flex; align-items: center; justify-content: center; font-size: var(--fs-1); font-weight: var(--weight-semibold); flex: none; }
    .m-foot-meta { flex: 1; min-width: 0; }
    .m-foot-name { display: block; font-size: var(--fs-2); font-weight: var(--weight-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-foot-plan { display: block; font-size: var(--fs-1); color: var(--fg-low); }

    /* ============ MAIN / CONTENT ============ */
    .m-main { flex: 1; position: relative; display: flex; flex-direction: column; min-height: 0; }
    .m-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* ---- HOME (empty state) ---- */
    .m-home { display: flex; flex-direction: column; min-height: 100%; justify-content: center; padding: var(--space-5) var(--space-4) var(--space-4); }
    .m-home.is-hidden { display: none; }
    .home-greet { display: flex; align-items: center; gap: var(--space-2); justify-content: center; text-align: center; }
    .home-spark { width: 30px; height: 30px; flex: none; }
    .home-title { font-size: var(--fs-7); line-height: var(--lh-7); letter-spacing: var(--ls-7); font-weight: var(--weight-bold); color: var(--fg-high); }
    .home-sub { text-align: center; color: var(--fg-low); font-size: var(--fs-3); margin-top: var(--space-2); }

    /* suggestion pills (chat) */
    .home-pills { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: center; margin-top: var(--space-6); }
    .home-pills.is-hidden { display: none; }
    .m-pill {
      display: inline-flex; align-items: center; gap: var(--space-2);
      min-height: 40px; padding: 0 var(--space-4);
      border: 1px solid var(--border-ui); border-radius: var(--radius-full);
      background: var(--color-surface); color: var(--fg-high);
      font-size: var(--fs-2); font-weight: var(--weight-medium);
    }
    .m-pill:active { background: var(--gray-3); }
    .m-pill svg { width: 16px; height: 16px; color: var(--fg-low); }

    /* cowork task cards */
    .cowork-suggest { display: none; flex-direction: column; gap: var(--space-2); margin-top: var(--space-6); }
    .cowork-suggest.is-shown { display: flex; }
    .task-card {
      display: flex; align-items: flex-start; gap: var(--space-3);
      width: 100%; text-align: left; padding: var(--space-3) var(--space-4);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-4);
      background: var(--color-surface); color: var(--fg-high);
    }
    .task-card:active { background: var(--gray-2); border-color: var(--border-ui); }
    .task-card .tc-ic { width: 34px; height: 34px; border-radius: var(--radius-3); background: var(--accent-2); color: var(--accent-11); display: flex; align-items: center; justify-content: center; flex: none; }
    .task-card .tc-ic svg { width: 18px; height: 18px; }
    .task-card > span:last-child { display: flex; flex-direction: column; min-width: 0; }
    .task-card .tc-t { display: block; font-size: var(--fs-2); font-weight: var(--weight-medium); }
    .task-card .tc-d { display: block; font-size: var(--fs-1); color: var(--fg-low); margin-top: 2px; }

    /* ---- THREAD (conversation) ---- */
    .m-thread { display: none; flex-direction: column; gap: var(--space-4); padding: var(--space-4) var(--space-4) var(--space-6); }
    .m-thread.is-shown { display: flex; }
    .user-turn { align-self: flex-end; max-width: 86%; background: var(--accent-2); border: 1px solid var(--accent-4); color: var(--fg-high); padding: var(--space-3) var(--space-4); border-radius: var(--radius-5); border-bottom-right-radius: var(--radius-2); font-size: var(--fs-3); line-height: var(--lh-3); }
    .agent-turn { display: flex; gap: var(--space-3); align-items: flex-start; max-width: 100%; }
    .agent-av { width: 28px; height: 28px; flex: none; }
    .agent-av svg { width: 28px; height: 28px; }
    .agent-body { flex: 1; min-width: 0; }
    .agent-body p { margin: 0 0 var(--space-3); font-size: var(--fs-3); line-height: var(--lh-3); }
    .agent-body p:last-child { margin-bottom: 0; }
    .agent-body h3 { font-size: var(--fs-4); line-height: var(--lh-4); margin: var(--space-3) 0 var(--space-2); font-weight: var(--weight-semibold); }
    .agent-body strong { font-weight: var(--weight-semibold); }
    .agent-meta { font-size: var(--fs-1); color: var(--fg-subtle); margin-bottom: var(--space-2); display: flex; align-items: center; gap: var(--space-2); }

    /* thinking + streaming caret */
    .m-thinking { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--fg-low); font-size: var(--fs-2); }
    .m-dots { display: inline-flex; gap: 3px; }
    .m-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--gray-8); animation: mdot 1.1s infinite ease-in-out; }
    .m-dots i:nth-child(2) { animation-delay: .15s; }
    .m-dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes mdot { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
    .caret::after { content: "▍"; color: var(--accent-9); margin-left: 1px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* feedback row */
    .fb-row { display: flex; align-items: center; gap: var(--space-1); margin-top: var(--space-3); }
    .fb-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border: 0; border-radius: var(--radius-3); background: transparent; color: var(--fg-low); }
    .fb-btn:active { background: var(--gray-3); }
    .fb-btn svg { width: 16px; height: 16px; }
    .fb-btn.is-ok { color: var(--green-11); }
    .model-tag { margin-left: auto; font-size: var(--fs-1); color: var(--fg-subtle); }

    /* run (cowork) */
    .run-card { border: 1px solid var(--border-subtle); border-radius: var(--radius-4); overflow: hidden; }
    .run-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); }
    .run-head .agent-av svg { width: 22px; height: 22px; }
    .rh-title { flex: 1; font-size: var(--fs-2); font-weight: var(--weight-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .run-steps { padding: var(--space-2) var(--space-4) var(--space-3); display: flex; flex-direction: column; gap: 2px; }
    .run-step { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; font-size: var(--fs-2); color: var(--fg-low); }
    .run-step .rs-ic { width: 18px; height: 18px; flex: none; display: flex; align-items: center; justify-content: center; }
    .run-step .rs-ic svg { width: 16px; height: 16px; }
    .run-step.is-active { color: var(--fg-high); }
    .run-step.is-done { color: var(--fg-high); }
    .run-step.is-done .rs-ic { color: var(--green-9); }
    .spinner { width: 15px; height: 15px; border: 2px solid var(--gray-5); border-top-color: var(--accent-9); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .run-progress { height: 4px; background: var(--gray-4); border-radius: var(--radius-full); overflow: hidden; margin-top: var(--space-1); }
    .run-progress > i { display: block; height: 100%; width: 0; background: var(--accent-9); transition: width .4s ease; }
    .run-foot { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4) var(--space-3); font-size: var(--fs-1); color: var(--fg-subtle); }

    /* result artifact card */
    .art-card { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-3); padding: var(--space-3) var(--space-4); border: 1px solid var(--border-subtle); border-radius: var(--radius-4); background: var(--gray-1); }
    .art-card .ac-ic { width: 34px; height: 34px; border-radius: var(--radius-3); background: var(--accent-2); color: var(--accent-11); display: flex; align-items: center; justify-content: center; flex: none; }
    .art-card .ac-ic svg { width: 18px; height: 18px; }
    .art-card .ac-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .art-card .ac-t { display: block; font-size: var(--fs-2); font-weight: var(--weight-medium); }
    .art-card .ac-s { display: block; font-size: var(--fs-1); color: var(--fg-low); }
    .art-open { border: 1px solid var(--border-ui); background: var(--color-surface); color: var(--fg-high); height: 34px; padding: 0 var(--space-3); border-radius: var(--radius-3); font-size: var(--fs-1); font-weight: var(--weight-medium); }

    /* ---- rich content (tables, badges) reused in agent turns ---- */
    .table-wrap { overflow-x: auto; margin: var(--space-2) 0 var(--space-3); border: 1px solid var(--border-subtle); border-radius: var(--radius-3); -webkit-overflow-scrolling: touch; }
    table.table { width: 100%; border-collapse: collapse; font-size: var(--fs-1); }
    table.table th, table.table td { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
    table.table thead th { background: var(--gray-2); color: var(--fg-low); font-weight: var(--weight-medium); }
    table.table tbody tr:last-child td { border-bottom: 0; }
    table.table td.cell-strong { font-weight: var(--weight-medium); color: var(--fg-high); white-space: normal; }
    .badge { display: inline-flex; align-items: center; padding: 2px var(--space-2); border-radius: var(--radius-full); font-size: 11px; font-weight: var(--weight-medium); line-height: 1.4; }
    .badge.is-danger { background: var(--danger-bg); color: var(--danger-text); }
    .badge.is-warning { background: var(--warning-bg); color: var(--warning-text); }
    .badge.is-success { background: var(--success-bg); color: var(--success-text); }

    /* ============ COMPOSER (sticky bottom) ============ */
    .m-composer {
      flex: 0 0 auto;
      border-top: 1px solid var(--border-subtle);
      background: var(--color-surface);
      padding: var(--space-2) var(--space-3);
      padding-bottom: calc(var(--space-2) + env(safe-area-inset-bottom));
    }
    .composer-box {
      border: 1px solid var(--border-ui); border-radius: var(--radius-5);
      background: var(--color-surface);
      box-shadow: var(--shadow-2);
      padding: var(--space-2) var(--space-2) var(--space-1);
    }
    .composer-box:focus-within { border-color: var(--border-strong); }
    .composer-input {
      width: 100%; border: 0; outline: none; resize: none;
      background: transparent; color: var(--fg-high);
      font-family: inherit; font-size: var(--fs-3); line-height: var(--lh-3);
      padding: var(--space-2) var(--space-2) var(--space-1);
      max-height: 140px; min-height: 24px;
    }
    .composer-input::placeholder { color: var(--fg-subtle); }
    .composer-top { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) 2px; }
    .composer-actions { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-1) 2px 0; }
    .ca-icon { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border: 0; border-radius: var(--radius-3); background: transparent; color: var(--fg-low); flex: none; }
    .ca-icon:active { background: var(--gray-3); }
    .ca-icon svg { width: 20px; height: 20px; }
    .ca-spacer { flex: 1; }

    /* mode toggle (segmented, neutral-active — one-pattern-per-role) */
    .composer-modes { display: inline-flex; background: var(--gray-3); border-radius: var(--radius-full); padding: 3px; }
    .cmode { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 var(--space-3); border: 0; background: transparent; color: var(--fg-low); font-size: var(--fs-1); font-weight: var(--weight-medium); border-radius: var(--radius-full); }
    .cmode svg { width: 14px; height: 14px; }
    .cmode.is-active { background: var(--color-surface); color: var(--fg-high); box-shadow: var(--shadow-2); }

    /* model chip -> opens bottom sheet */
    .model-chip { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-3); background: transparent; color: var(--fg-high); font-size: var(--fs-1); font-weight: var(--weight-medium); flex: 0 1 auto; min-width: 0; }
    .model-chip:active { background: var(--gray-3); }
    .model-chip .mdl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .model-chip .mdl-model, .model-chip .eff { color: var(--fg-low); }
    .model-chip .mdl-model::before, .model-chip .eff::before { content: "·"; margin-right: 5px; color: var(--fg-subtle); }
    .model-chip svg { width: 14px; height: 14px; flex: none; }

    .btn-send { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; border-radius: var(--radius-3); background: var(--accent-9); color: var(--accent-contrast); flex: none; }
    .btn-send:disabled { background: var(--gray-4); color: var(--gray-9); }
    .btn-send:not(:disabled):active { background: var(--accent-10); }
    .btn-send svg { width: 20px; height: 20px; }
    .btn-stop { background: var(--gray-12); color: var(--gray-1); }

    /* cowork row (project + approval chips) */
    .composer-cowork { display: none; align-items: center; gap: var(--space-1); padding: var(--space-2) 2px 0; flex-wrap: wrap; }
    .composer-cowork.is-shown { display: flex; }
    .cw-chip { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 var(--space-3); border: 1px solid var(--border-ui); border-radius: var(--radius-full); background: var(--color-surface); color: var(--fg-high); font-size: var(--fs-1); font-weight: var(--weight-medium); }
    .cw-chip:active { background: var(--gray-3); }
    .cw-chip svg { width: 14px; height: 14px; color: var(--fg-low); }
    .usage-note { margin-left: auto; font-size: 11px; color: var(--fg-subtle); }
    .composer-hint { text-align: center; font-size: 11px; color: var(--fg-subtle); padding: var(--space-1) 0 0; }

    /* ============ BOTTOM SHEET ============ */
    .m-sheet-scrim { position: absolute; inset: 0; z-index: 60; background: var(--color-overlay); opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility .2s ease; }
    .m-sheet-scrim.is-open { opacity: 1; visibility: visible; }
    .m-sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 70;
      background: var(--color-surface);
      border-radius: 18px 18px 0 0;
      box-shadow: var(--shadow-5);
      transform: translateY(102%); visibility: hidden;
      transition: transform .26s cubic-bezier(.4,0,.2,1), visibility .26s ease;
      max-height: 82%; display: flex; flex-direction: column;
      padding-bottom: calc(var(--space-3) + env(safe-area-inset-bottom));
    }
    .m-sheet.is-open { transform: translateY(0); visibility: visible; }
    .sheet-grip { width: 36px; height: 4px; border-radius: var(--radius-full); background: var(--gray-6); margin: var(--space-3) auto var(--space-1); flex: none; }
    .sheet-title { padding: var(--space-2) var(--space-4) var(--space-1); font-size: var(--fs-1); color: var(--fg-subtle); }
    .sheet-body { overflow-y: auto; padding: var(--space-1) var(--space-2) var(--space-2); }

    .sheet-item {
      display: flex; align-items: center; gap: var(--space-3);
      width: 100%; min-height: 52px; padding: var(--space-2) var(--space-3);
      border: 0; background: transparent; text-align: left;
      color: var(--fg-high); border-radius: var(--radius-3);
    }
    .sheet-item:active { background: var(--gray-3); }
    .si-ic { width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--fg-low); }
    .si-ic svg { width: 20px; height: 20px; }
    .si-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .si-title { display: block; font-size: var(--fs-3); font-weight: var(--weight-regular); }
    .si-sub { display: block; font-size: var(--fs-1); color: var(--fg-low); margin-top: 1px; }
    .si-check { color: var(--accent-11); flex: none; opacity: 0; }
    .si-check svg { width: 20px; height: 20px; }
    .sheet-item.is-selected .si-check { opacity: 1; }

    /* toast */
    .m-toast { position: absolute; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(8px); z-index: 90; background: var(--gray-12); color: var(--gray-1); font-size: var(--fs-1); padding: var(--space-2) var(--space-4); border-radius: var(--radius-full); box-shadow: var(--shadow-4); opacity: 0; visibility: hidden; transition: opacity .2s ease, transform .2s ease, visibility .2s ease; white-space: nowrap; }
    .m-toast.is-open { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>

          <span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </button>
        <div class="sheet-title" style="margin-top:var(--space-2);">Effort</div>
        <button class="sheet-item is-selected" data-eff="High"><span class="si-body"><span class="si-title">High</span></span><span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="sheet-item" data-eff="Medium"><span class="si-body"><span class="si-title">Medium</span></span><span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="sheet-item" data-eff="Low"><span class="si-body"><span class="si-title">Low</span></span><span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
      </div>
    </div>

    <!-- Approval -->
    <div class="m-sheet" id="approvalSheet" role="dialog" aria-label="Approval mode">
      <div class="sheet-grip"></div>
      <div class="sheet-title">Approvals</div>
      <div class="sheet-body">
        <button class="sheet-item is-selected" data-approval="Manual approval">
          <span class="si-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></span>
          <span class="si-body"><span class="si-title">Manually approve</span><span class="si-sub">Review each step before it runs</span></span>
          <span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </button>
        <button class="sheet-item" data-approval="Auto approval">
          <span class="si-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m13 19 9-7-9-7v14ZM2 19l9-7-9-7v14Z"/></svg></span>
          <span class="si-body"><span class="si-title">Automatically approve</span><span class="si-sub">Run end-to-end without pausing</span></span>
          <span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </button>
        <button class="sheet-item" data-approval="Skip approvals">
          <span class="si-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/></svg></span>
          <span class="si-body"><span class="si-title">Skip all approvals</span><span class="si-sub">Fastest — no confirmations</span></span>
          <span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        </button>
      </div>
    </div>

    <!-- Project -->
    <div class="m-sheet" id="projectSheet" role="dialog" aria-label="Project">
      <div class="sheet-grip"></div>
      <div class="sheet-title">Project</div>
      <div class="sheet-body">
        <button class="sheet-item is-selected" data-project="No project"><span class="si-body"><span class="si-title">No project</span></span><span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="sheet-item" data-project="Occupancy Recovery"><span class="si-body"><span class="si-title">Occupancy Recovery</span><span class="si-sub">8 chats · 5 artifacts</span></span><span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="sheet-item" data-project="Board Reporting"><span class="si-body"><span class="si-title">Board Reporting</span><span class="si-sub">4 chats · 12 artifacts</span></span><span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="sheet-item" data-project="Care Acuity Study"><span class="si-body"><span class="si-title">Care Acuity Study</span><span class="si-sub">3 chats · 6 artifacts</span></span><span class="si-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
      </div>
    </div>

    <!-- Plus / attach -->
    <div class="m-sheet" id="plusSheet" role="dialog" aria-label="Add">
      <div class="sheet-grip"></div>
      <div class="sheet-title">Add to conversation</div>
      <div class="sheet-body">
        <button class="sheet-item" data-toast="Upload — prototype"><span class="si-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></span><span class="si-body"><span class="si-title">Upload a file</span></span></button>
        <button class="sheet-item" data-toast="Camera — prototype"><span class="si-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span class="si-body"><span class="si-title">Take a photo</span></span></button>
        <button class="sheet-item" data-toast="Data source — prototype"><span class="si-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg></span><span class="si-body"><span class="si-title">Connect a data source</span></span></button>
      </div>
    </div>

    <div class="m-toast" id="toast" role="status"></div>
  </div>

  <script>
    (function () {
      var device = document.getElementById('device');
      var scrim = device.querySelector('[data-scrim]');
      var drawer = document.getElementById('drawer');
      var sheetScrim = device.querySelector('[data-sheet-scrim]');
      var input = document.getElementById('input');
      var sendBtn = document.getElementById('send');
      var home = document.getElementById('home');
      var thread = document.getElementById('thread');
      var scroll = document.getElementById('scroll');
      var homePills = document.getElementById('homePills');
      var coworkSuggest = document.getElementById('coworkSuggest');
      var coworkRow = document.getElementById('coworkRow');
      var homeSub = document.getElementById('homeSub');
      var hint = document.getElementById('hint');
      var toastEl = document.getElementById('toast');
      var GREETING_NAME = 'Sumit';
      var mode = 'chat';
      var streaming = false;
      var streamTimer = null, toastTimer = null;

      function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

      /* ---------- toast ---------- */
      function toast(msg){
        toastEl.textContent = msg; toastEl.classList.add('is-open');
        clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove('is-open'); }, 1900);
      }

      /* ---------- drawer ---------- */
      function openDrawer(){ drawer.classList.add('is-open'); scrim.classList.add('is-open'); }
      function closeDrawer(){ drawer.classList.remove('is-open'); scrim.classList.remove('is-open'); }
      device.querySelectorAll('[data-drawer-open]').forEach(function(b){ b.addEventListener('click', openDrawer); });
      device.querySelectorAll('[data-drawer-close]').forEach(function(b){ b.addEventListener('click', closeDrawer); });
      scrim.addEventListener('click', closeDrawer);

      /* ---------- bottom sheets ---------- */
      var openSheet = null;
      function showSheet(el){ if(openSheet) openSheet.classList.remove('is-open'); openSheet = el; el.classList.add('is-open'); sheetScrim.classList.add('is-open'); }
      function hideSheet(){ if(openSheet) openSheet.classList.remove('is-open'); openSheet = null; sheetScrim.classList.remove('is-open'); }
      sheetScrim.addEventListener('click', hideSheet);
      device.querySelector('[data-model-open]').addEventListener('click', function(){ showSheet(document.getElementById('modelSheet')); });
      device.querySelector('[data-approval-open]').addEventListener('click', function(){ showSheet(document.getElementById('approvalSheet')); });
      device.querySelector('[data-project-open]').addEventListener('click', function(){ showSheet(document.getElementById('projectSheet')); });
      device.querySelector('[data-plus]').addEventListener('click', function(){ showSheet(document.getElementById('plusSheet')); });

      /* plus-sheet toast items */
      document.getElementById('plusSheet').querySelectorAll('[data-toast]').forEach(function(b){
        b.addEventListener('click', function(){ hideSheet(); toast(b.getAttribute('data-toast')); });
      });

      /* ---------- model + effort sheet ---------- */
      var modelChip = device.querySelector('[data-model-open]');
      var modelSheet = document.getElementById('modelSheet');
      modelSheet.querySelectorAll('[data-model]').forEach(function(b){
        b.addEventListener('click', function(){
          modelSheet.querySelectorAll('[data-model]').forEach(function(x){ x.classList.remove('is-selected'); });
          b.classList.add('is-selected');
          modelChip.querySelector('.mdl').textContent = b.getAttribute('data-model');
          modelChip.querySelector('.mdl-model').textContent = b.getAttribute('data-short');
          hideSheet();
        });
      });
      modelSheet.querySelectorAll('[data-eff]').forEach(function(b){
        b.addEventListener('click', function(){
          modelSheet.querySelectorAll('[data-eff]').forEach(function(x){ x.classList.remove('is-selected'); });
          b.classList.add('is-selected');
          modelChip.querySelector('.eff').textContent = b.getAttribute('data-eff');
          hideSheet();
        });
      });

      /* ---------- approval + project sheets ---------- */
      var approvalSheet = document.getElementById('approvalSheet');
      var approvalLabel = device.querySelector('[data-approval-label]');
      approvalSheet.querySelectorAll('[data-approval]').forEach(function(b){
        b.addEventListener('click', function(){
          approvalSheet.querySelectorAll('[data-approval]').forEach(function(x){ x.classList.remove('is-selected'); });
          b.classList.add('is-selected');
          approvalLabel.textContent = b.getAttribute('data-approval');
          hideSheet();
        });
      });
      var projectSheet = document.getElementById('projectSheet');
      var projectLabel = device.querySelector('[data-project-label]');
      projectSheet.querySelectorAll('[data-project]').forEach(function(b){
        b.addEventListener('click', function(){
          projectSheet.querySelectorAll('[data-project]').forEach(function(x){ x.classList.remove('is-selected'); });
          b.classList.add('is-selected');
          projectLabel.textContent = b.getAttribute('data-project');
          hideSheet();
        });
      });

      /* ---------- mic (dictation placeholder) ---------- */
      device.querySelector('[data-mic]').addEventListener('click', function(){ toast('Dictation — prototype'); });
      device.querySelector('[data-theme-toggle]').addEventListener('click', function(){
        var root = document.documentElement;
        root.setAttribute('data-theme', root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });

      /* ---------- composer autosize + send-enable ---------- */
      function autosize(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
      function updateSend(){ sendBtn.disabled = streaming ? false : input.value.trim().length === 0; }
      input.addEventListener('input', function(){ autosize(); updateSend(); });
      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if (!sendBtn.disabled) sendBtn.click(); }
      });

      /* ---------- mode toggle ---------- */
      function applyMode(m){
        mode = m;
        device.querySelectorAll('[data-cmode]').forEach(function(b){
          var on = b.getAttribute('data-cmode') === m;
          b.classList.toggle('is-active', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        var chat = m === 'chat';
        input.placeholder = chat ? 'How can I help you today?' : 'What can I take off your plate?';
        homeSub.textContent = chat ? 'How can I help you today?' : 'What can I take off your plate?';
        homePills.classList.toggle('is-hidden', !chat);
        coworkSuggest.classList.toggle('is-shown', !chat);
        coworkRow.classList.toggle('is-shown', !chat);
        hint.textContent = chat ? 'Enter to send · type here to start' : 'Delegate a task — skyAgent runs it step by step';
      }
      device.querySelectorAll('[data-cmode]').forEach(function(b){
        b.addEventListener('click', function(){ applyMode(b.getAttribute('data-cmode')); });
      });

      /* ---------- new chat ---------- */
      function newChat(){
        stopStream();
        thread.innerHTML = ''; thread.classList.remove('is-shown');
        home.classList.remove('is-hidden');
        input.value = ''; autosize(); updateSend();
        closeDrawer();
      }
      device.querySelectorAll('[data-new-chat]').forEach(function(b){ b.addEventListener('click', newChat); });

      function goThread(){ home.classList.add('is-hidden'); thread.classList.add('is-shown'); }
      function scrollBottom(){ requestAnimationFrame(function(){ scroll.scrollTop = scroll.scrollHeight; }); }

      /* ---------- pills + task cards ---------- */
      homePills.querySelectorAll('[data-pill]').forEach(function(b){
        b.addEventListener('click', function(){ input.value = b.getAttribute('data-pill'); autosize(); updateSend(); input.focus(); });
      });
      coworkSuggest.querySelectorAll('[data-task]').forEach(function(b){
        b.addEventListener('click', function(){ runTask(b.getAttribute('data-task')); });
      });

      /* ---------- send ---------- */
      sendBtn.addEventListener('click', function(){
        if (streaming){ stopStream(); return; }
        var text = input.value.trim(); if (!text) return;
        input.value = ''; autosize(); updateSend();
        if (mode === 'cowork'){ runTask(text); } else { sendChat(text); }
      });

      function addUserTurn(text){
        var el = document.createElement('div');
        el.className = 'user-turn'; el.textContent = text;
        thread.appendChild(el);
      }

      /* ---------- CHAT: streaming ---------- */
      function replyFor(text){
        var t = text.toLowerCase();
        if (t.indexOf('brief') >= 0) return REPLIES.briefing;
        if (t.indexOf('q3') >= 0 || t.indexOf('recovery') >= 0 || t.indexOf('plan') >= 0) return REPLIES.q3plan;
        if (t.indexOf('willow') >= 0 || t.indexOf('move-out') >= 0 || t.indexOf('moveout') >= 0) return REPLIES.willow;
        if (t.indexOf('occupancy') >= 0 || t.indexOf('analy') >= 0 || t.indexOf('trend') >= 0) return REPLIES.occupancy;
        return REPLIES.generic;
      }

      function sendChat(text){
        goThread(); addUserTurn(text); scrollBottom();
        var turn = document.createElement('div');
        turn.className = 'agent-turn';
        turn.innerHTML = '<span class="agent-av"><svg viewBox="0 0 82 84" aria-hidden="true"><use href="#sa-mark"/></svg></span>' +
          '<div class="agent-body"><span class="m-thinking">Thinking<span class="m-dots"><i></i><i></i><i></i></span></span></div>';
        thread.appendChild(turn); scrollBottom();
        var body = turn.querySelector('.agent-body');
        streaming = true; setSendStop(true);

        var payload = replyFor(text);
        setTimeout(function(){
          if (!streaming) return;
          body.innerHTML = '<div class="agent-meta">' + payload.meta + '</div><p class="caret"></p>';
          var p = body.querySelector('p');
          var words = payload.lead.split(' '); var i = 0;
          streamTimer = setInterval(function(){
            if (i >= words.length){
              clearInterval(streamTimer);
              p.classList.remove('caret');
              body.insertAdjacentHTML('beforeend', payload.rich);
              body.appendChild(feedbackRow());
              finishStream(); scrollBottom(); return;
            }
            p.textContent += (i ? ' ' : '') + words[i]; i++;
            scrollBottom();
          }, 34);
        }, 620);
      }

      function feedbackRow(){
        var row = document.createElement('div'); row.className = 'fb-row';
        row.innerHTML =
          '<button class="fb-btn" data-copy aria-label="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>' +
          '<button class="fb-btn" aria-label="Good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg></button>' +
          '<button class="fb-btn" aria-label="Bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg></button>' +
          '<span class="model-tag" data-tag></span>';
        row.querySelector('[data-tag]').textContent = modelChip.querySelector('.mdl').textContent + ' · ' + modelChip.querySelector('.mdl-model').textContent;
        row.querySelector('[data-copy]').addEventListener('click', function(){
          var btn = this; btn.classList.add('is-ok');
          try { navigator.clipboard && navigator.clipboard.writeText(row.closest('.agent-body').innerText); } catch(e){}
          toast('Copied'); setTimeout(function(){ btn.classList.remove('is-ok'); }, 1400);
        });
        return row;
      }

      function setSendStop(isStop){
        if (isStop){ sendBtn.classList.add('btn-stop'); sendBtn.setAttribute('aria-label','Stop'); sendBtn.disabled = false;
          sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'; }
        else { sendBtn.classList.remove('btn-stop'); sendBtn.setAttribute('aria-label','Send');
          sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>'; updateSend(); }
      }
      function finishStream(){ streaming = false; setSendStop(false); }
      function stopStream(){ if (streamTimer) clearInterval(streamTimer); if (streaming){ var c = thread.querySelector('.caret'); if (c) c.classList.remove('caret'); } finishStream(); }

      /* ---------- COWORK: live run ---------- */
      var RUN_STEPS = ['Reading portfolio data', 'Querying community metrics', 'Cross-checking against forecast', 'Drafting the work product'];
      function runTask(title){
        applyMode('cowork');
        goThread(); addUserTurn(title); scrollBottom();
        var card = document.createElement('div'); card.className = 'agent-turn';
        card.innerHTML =
          '<div class="run-card" style="flex:1;">' +
            '<div class="run-head"><span class="agent-av"><svg viewBox="0 0 82 84" aria-hidden="true"><use href="#sa-mark"/></svg></span>' +
            '<span class="rh-title">' + esc(title) + '</span><span class="badge is-warning" data-status>Running</span></div>' +
            '<div class="run-steps" data-steps></div>' +
            '<div class="run-progress"><i data-bar></i></div>' +
            '<div class="run-foot"><span data-count>0 / ' + RUN_STEPS.length + '</span><span>·</span><span data-elapsed>0.0s</span></div>' +
          '</div>';
        thread.appendChild(card); scrollBottom();
        var stepsWrap = card.querySelector('[data-steps]');
        var bar = card.querySelector('[data-bar]');
        var countEl = card.querySelector('[data-count]');
        var elapsedEl = card.querySelector('[data-elapsed]');
        var statusEl = card.querySelector('[data-status]');

        RUN_STEPS.forEach(function(s){
          var row = document.createElement('div'); row.className = 'run-step';
          row.innerHTML = '<span class="rs-ic"><svg viewBox="0 0 24 24" fill="none" stroke="var(--gray-7)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/></svg></span><span>' + esc(s) + '</span>';
          stepsWrap.appendChild(row);
        });
        var rows = stepsWrap.querySelectorAll('.run-step');
        var t0 = 0; var elapsedTimer = setInterval(function(){ t0 += 0.1; elapsedEl.textContent = t0.toFixed(1) + 's'; }, 100);
        streaming = true; setSendStop(true);

        var i = 0;
        function next(){
          if (!streaming){ clearInterval(elapsedTimer); return; }
          if (i > 0){ rows[i-1].classList.remove('is-active'); rows[i-1].classList.add('is-done');
            rows[i-1].querySelector('.rs-ic').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'; }
          countEl.textContent = i + ' / ' + RUN_STEPS.length;
          bar.style.width = (i / RUN_STEPS.length * 100) + '%';
          if (i >= RUN_STEPS.length){
            clearInterval(elapsedTimer);
            statusEl.textContent = 'Done'; statusEl.className = 'badge is-success';
            card.querySelector('.run-card').insertAdjacentHTML('beforeend', resultArtifact(title));
            wireArtifact(card);
            finishStream(); scrollBottom(); return;
          }
          rows[i].classList.add('is-active');
          rows[i].querySelector('.rs-ic').innerHTML = '<span class="spinner"></span>';
          i++; scrollBottom();
          setTimeout(next, 1100 + Math.round((i % 3) * 260));
        }
        setTimeout(next, 500);
      }
      function resultArtifact(title){
        return '<div style="padding:0 var(--space-4) var(--space-4);">' +
          '<div class="art-card"><span class="ac-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg></span>' +
          '<span class="ac-meta"><span class="ac-t">' + esc(title.length > 34 ? title.slice(0,34) + '…' : title) + '</span><span class="ac-s">Report · just now</span></span>' +
          '<button class="art-open" data-open>Open</button></div></div>';
      }
      function wireArtifact(card){
        var b = card.querySelector('[data-open]'); if (b) b.addEventListener('click', function(){ toast('Opening artifact — prototype'); });
      }

      /* ---------- recents ---------- */
      var recentList = document.getElementById('recentList');
      recentList.querySelectorAll('.m-recent').forEach(function(row){
        row.addEventListener('click', function(){
          recentList.querySelectorAll('.m-recent').forEach(function(r){ r.classList.remove('is-active'); });
          row.classList.add('is-active');
          var key = row.getAttribute('data-conv');
          closeDrawer();
          if (key && CONVOS[key]){ goThread(); thread.innerHTML = CONVOS[key]; wireCopies(); scroll.scrollTop = 0; }
          else { toast('Conversation — prototype'); }
        });
      });
      function wireCopies(){
        thread.querySelectorAll('[data-copy]').forEach(function(btn){
          btn.addEventListener('click', function(){ btn.classList.add('is-ok'); toast('Copied'); setTimeout(function(){ btn.classList.remove('is-ok'); }, 1400); });
        });
      }

      /* ---------- search filter ---------- */
      var searchInput = document.getElementById('searchInput');
      var noResult = document.getElementById('noResult');
      searchInput.addEventListener('input', function(){
        var q = searchInput.value.trim().toLowerCase(); var any = false;
        recentList.querySelectorAll('.m-recent').forEach(function(row){
          var match = row.querySelector('.cr-title').textContent.toLowerCase().indexOf(q) >= 0;
          row.style.display = match ? '' : 'none'; if (match) any = true;
        });
        recentList.querySelectorAll('[data-grp]').forEach(function(g){
          var n = g.nextElementSibling, show = false;
          while (n && n.classList && n.classList.contains('m-recent')){ if (n.style.display !== 'none') show = true; n = n.nextElementSibling; }
          g.style.display = show ? '' : 'none';
        });
        noResult.style.display = any ? 'none' : 'block';
      });

      /* ---------- seed conversations ---------- */
      function convo(user, meta, rich){
        return '<div class="user-turn">' + esc(user) + '</div>' +
          '<div class="agent-turn"><span class="agent-av"><svg viewBox="0 0 82 84" aria-hidden="true"><use href="#sa-mark"/></svg></span>' +
          '<div class="agent-body"><div class="agent-meta">' + meta + '</div>' + rich + feedbackHTML() + '</div></div>';
      }
      function feedbackHTML(){
        return '<div class="fb-row">' +
          '<button class="fb-btn" data-copy aria-label="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>' +
          '<span class="model-tag">skyAgent Pro · Sonnet</span></div>';
      }
      var CONVOS = {
        briefing: convo("Give me my morning briefing — what are today's priorities, urgent alerts, and key metrics I should know about?", '7 tools &middot; 29.2s',

        q3plan: convo("Draft a Q3 occupancy recovery plan for the at-risk communities.", '9 tools &middot; 41.6s',
          '<h3 style="margin-top:0;">Q3 Occupancy Recovery Plan</h3><p>Draft plan for the three at-risk communities — focused on move-out prevention and lead re-engagement.</p><div class="table-wrap"><table class="table"><thead><tr><th>Community</th><th>Action</th><th>Owner</th><th>Target</th></tr></thead><tbody><tr><td class="cell-strong">Quiet Haven Manor</td><td>Wellness check-ins + rate-retention offers</td><td>Care</td><td>+4 net by Sep</td></tr><tr><td class="cell-strong">Bright Days Living</td><td>Tour-to-move-in follow-up sprint</td><td>Sales</td><td>+3 net by Sep</td></tr><tr><td class="cell-strong">Rosewood Court</td><td>Exit-reason interviews + win-back</td><td>Ops</td><td>Stabilize</td></tr></tbody></table></div><p>Projected portfolio lift: <strong>+2.1 pts occupancy</strong> by end of Q3. Want me to turn this into a PPTX for the board?</p>'),
        willow: convo("Summarize the recent move-outs at Willow Springs.", '5 tools &middot; 18.3s',
          '<h3 style="margin-top:0;">Willow Springs — Move-Out Summary</h3><p>15 move-outs in the last 60 days. The main driver is rising care acuity, not price.</p><div class="table-wrap"><table class="table"><thead><tr><th>Reason</th><th>Count</th><th>Share</th></tr></thead><tbody><tr><td>Higher acuity / care needs</td><td>6</td><td>40%</td></tr><tr><td>Cost / rate</td><td>4</td><td>27%</td></tr><tr><td>Relocation (family)</td><td>3</td><td>20%</td></tr><tr><td>Other</td><td>2</td><td>13%</td></tr></tbody></table></div><p><strong>Insight:</strong> a higher-acuity care tier could retain ~40% of these residents. Want me to model the revenue impact?</p>')
      };

      var REPLIES = {
        briefing: { meta: '7 tools &middot; 29.2s', lead: 'Good morning, Sumit. Here is your priority snapshot for today.',
          rich: '<h3>Critical issues</h3><div class="table-wrap"><table class="table"><thead><tr><th>Issue</th><th>Status</th><th>Impact</th></tr></thead><tbody><tr><td class="cell-strong">Negative Net MIMO</td><td><span class="badge is-danger">Critical</span></td><td>-8 residents in June.</td></tr><tr><td class="cell-strong">Revenue Below Budget</td><td><span class="badge is-danger">Critical</span></td><td>$15.7M vs $20.2M (-22%).</td></tr><tr><td class="cell-strong">Occupancy Stalled</td><td><span class="badge is-warning">Watch</span></td><td>69.95%, below healthy range.</td></tr></tbody></table></div><p>Want me to dive deeper into any community?</p>' },
        q3plan: { meta: '9 tools &middot; 41.6s', lead: 'Here is a draft Q3 recovery plan for the three at-risk communities.',
          rich: '<div class="table-wrap"><table class="table"><thead><tr><th>Community</th><th>Action</th><th>Target</th></tr></thead><tbody><tr><td class="cell-strong">Quiet Haven Manor</td><td>Wellness check-ins + retention offers</td><td>+4 net</td></tr><tr><td class="cell-strong">Bright Days Living</td><td>Tour-to-move-in follow-up sprint</td><td>+3 net</td></tr><tr><td class="cell-strong">Rosewood Court</td><td>Exit-reason interviews + win-back</td><td>Stabilize</td></tr></tbody></table></div><p>Projected lift: <strong>+2.1 pts occupancy</strong> by end of Q3. Turn this into a board PPTX?</p>' },
        willow: { meta: '5 tools &middot; 18.3s', lead: 'Willow Springs had 15 move-outs in the last 60 days; care acuity is the main driver.',
          rich: '<div class="table-wrap"><table class="table"><thead><tr><th>Reason</th><th>Count</th><th>Share</th></tr></thead><tbody><tr><td>Higher acuity / care needs</td><td>6</td><td>40%</td></tr><tr><td>Cost / rate</td><td>4</td><td>27%</td></tr><tr><td>Relocation (family)</td><td>3</td><td>20%</td></tr><tr><td>Other</td><td>2</td><td>13%</td></tr></tbody></table></div><p><strong>Insight:</strong> a higher-acuity care tier could retain ~40% of these residents. Model the revenue impact?</p>' },
        occupancy: { meta: '6 tools &middot; 24.8s', lead: 'Portfolio occupancy over the last 90 days trended down 1.8 points, concentrated in three communities.',
          rich: '<div class="table-wrap"><table class="table"><thead><tr><th>Community</th><th>90-day Δ</th><th>Now</th></tr></thead><tbody><tr><td class="cell-strong">Quiet Haven Manor</td><td><span class="badge is-danger">-4.1 pts</span></td><td>64.2%</td></tr><tr><td class="cell-strong">Rosewood Court</td><td><span class="badge is-warning">-2.3 pts</span></td><td>67.0%</td></tr><tr><td class="cell-strong">The Aspens</td><td><span class="badge is-success">+1.5 pts</span></td><td>78.4%</td></tr></tbody></table></div><p>The decline is acuity-driven, not price. Want a recovery plan for the bottom two?</p>' },
        generic: { meta: '4 tools &middot; 12.1s', lead: 'Here is what I found across your portfolio data. I pulled the latest metrics and cross-checked them against your targets.',
          rich: '<p>I can go deeper on any thread — build a report, set an alert, or draft outreach. Just say the word and I’ll take it from here.</p>' }
      };

      /* ---------- init ---------- */
      applyMode('chat');
      // personalize greeting
      device.querySelector('.home-title').textContent = 'Hey there, ' + GREETING_NAME;
      autosize(); updateSend();
    })();
  </script>
